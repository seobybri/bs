<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distill It — Gain clarity. Find peace.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>Gain clarity. Find peace.</h1>
    <p class="tagline">Start your Fourth Step privately — in less than a minute.</p>
    <button id="startBtn" class="primary">Write my first entry →</button>
  </header>

  <main id="entrySection" class="hidden">
    <section class="card">
      <h2>What’s on your mind today?</h2>
      <select id="entryType">
        <option value="resentment">🔥 Resentment — anger or bitterness</option>
        <option value="fear">💡 Fear — something you’re worried about</option>
        <option value="harm">✍️ Harm Done — something you regret</option>
      </select>

      <label>Who or what?</label>
      <textarea id="who" placeholder="Name the person, institution, or situation"></textarea>

      <label>What happened?</label>
      <textarea id="what" placeholder="Describe briefly"></textarea>

      <label>My part</label>
      <textarea id="myPart" placeholder="Where were you selfish, dishonest, or afraid?"></textarea>

      <button id="reflectBtn" class="primary">Reflect now</button>
    </section>
  </main>

  <section id="reflecting" class="hidden">
    <div class="loader"></div>
    <p>Bill is reflecting…</p>
  </section>

  <section id="reflectionSection" class="hidden">
    <div class="card reflection">
      <p><strong>That took courage.</strong></p>
      <div id="reflectionText"></div>
    </div>
    <button id="saveBtn" class="primary">Save this experience</button>
  </section>

  <section id="authSection" class="hidden card">
    <h3>Create your local account</h3>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button id="createAccount" class="primary">Create</button>
    <p>Already have one? <a id="signInLink" href="#">Sign in</a></p>
  </section>

  <footer>
    <p>Distill It — private reflection tool. <span class="dim">Nothing stored online.</span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
